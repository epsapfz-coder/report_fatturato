<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPSA · Report Fatturato & Pratiche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script crossorigin src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg: #f6f7f9;
      --bg-soft: #eef1f5;
      --card: #ffffff;
      --ink: #0b1220;
      --ink-2: #1e293b;
      --muted: #64748b;
      --muted-2: #94a3b8;
      --line: #e2e8f0;
      --line-2: #eef2f6;
      --accent: #1e40af;
      --accent-2: #3b82f6;
      --accent-soft: #eef4ff;
      --success: #0f9d68;
      --success-soft: #e7f6ef;
      --warning: #c27803;
      --warning-soft: #fdf4e3;
      --danger: #c5291f;
      --danger-soft: #fdebe9;
      --violet: #7e22ce;
      --violet-soft: #f5eeff;
      --radius: 10px;
      --shadow-xs: 0 1px 1px rgba(15,23,42,.04);
      --shadow-sm: 0 1px 2px rgba(15,23,42,.05), 0 1px 1px rgba(15,23,42,.03);
      --shadow: 0 2px 6px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
      --shadow-lg: 0 16px 40px -8px rgba(15,23,42,.15), 0 4px 12px rgba(15,23,42,.06);
      --shadow-xl: 0 24px 60px -12px rgba(15,23,42,.25), 0 8px 20px rgba(15,23,42,.08);
    }

    * { box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02","cv03","cv04","cv11";
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select { font: inherit; color: inherit; }
    a { color: var(--accent); text-decoration: none; }

    /* --- Layout --- */
    .app { min-height: 100vh; display: flex; flex-direction: column; }

    .header {
      background: #0b1220;
      color: #f8fafc;
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.05);
      position: sticky; top: 0; z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      display: grid; place-items: center;
      font-weight: 800; font-size: 13px; color: white;
      box-shadow: 0 4px 10px rgba(59,130,246,.3);
    }
    .brand-text h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .brand-text p { margin: 0; font-size: 11px; color: #94a3b8; font-weight: 400; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .file-status {
      font-size: 11px; color: #94a3b8;
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 6px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.05);
    }
    .file-status strong { color: #e2e8f0; font-weight: 600; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 7px;
      font-size: 12px; font-weight: 600;
      transition: all .15s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent-2); color: white; }
    .btn-primary:hover { background: var(--accent); }
    .btn-ghost { background: rgba(255,255,255,.04); color: #e2e8f0; border-color: rgba(255,255,255,.08); }
    .btn-ghost:hover { background: rgba(255,255,255,.08); }
    .btn-outline { background: var(--card); color: var(--ink-2); border: 1px solid var(--line); }
    .btn-outline:hover { background: var(--bg-soft); border-color: #cbd5e1; }
    .btn-outline:disabled { opacity: .4; cursor: not-allowed; }
    .btn-sm { padding: 5px 9px; font-size: 11px; }

    /* --- Upload --- */
    .upload-wrap { padding: 48px 28px; display: grid; place-items: center; flex: 1; }
    .upload {
      max-width: 560px; width: 100%;
      background: var(--card);
      border: 1.5px dashed #cbd5e1;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      transition: all .2s ease;
    }
    .upload.drag { border-color: var(--accent-2); background: var(--accent-soft); }
    .upload h2 { margin: 16px 0 6px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
    .upload p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .upload-icon {
      width: 52px; height: 52px; margin: 0 auto; border-radius: 12px;
      background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
      display: grid; place-items: center;
      color: var(--accent);
    }
    .upload-cta { margin-top: 14px; display: flex; justify-content: center; gap: 10px; }
    .upload-hint { margin-top: 16px; font-size: 11px; color: var(--muted-2); font-family: 'JetBrains Mono', monospace; }
    input[type="file"] { display: none; }

    .req-list {
      text-align: left;
      margin-top: 20px;
      padding: 14px 16px;
      background: var(--bg-soft);
      border-radius: 8px;
      font-size: 11px;
      color: var(--muted);
    }
    .req-list strong { color: var(--ink-2); font-weight: 600; }
    .req-list code {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      background: white; padding: 1px 5px; border-radius: 3px;
      border: 1px solid var(--line);
    }

    .err {
      background: var(--danger-soft); color: var(--danger);
      border: 1px solid #fecaca; padding: 10px 14px;
      border-radius: 8px; font-size: 12px; margin-top: 16px;
      text-align: left;
    }

    /* --- Filters --- */
    .filters {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 14px 28px;
      position: sticky; top: 61px; z-index: 40;
    }
    .filters-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .filter-label {
      font-size: 10px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--muted);
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 11px; font-weight: 500;
      color: var(--ink-2);
      transition: all .12s ease;
      white-space: nowrap;
    }
    .chip:hover { border-color: #94a3b8; background: var(--bg-soft); }
    .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chip.active:hover { background: var(--ink-2); }

    .filter-compact input[type="month"],
    .filter-compact input[type="text"],
    .filter-compact select {
      padding: 5px 8px; border: 1px solid var(--line);
      border-radius: 6px; font-size: 11px;
      background: var(--card); outline: none;
    }
    .filter-compact input[type="month"] { width: 130px; }
    .filter-compact input[type="text"] { min-width: 200px; }
    .filter-compact input:focus, .filter-compact select:focus { border-color: var(--accent-2); }

    .filter-actions {
      display: flex; align-items: flex-end; gap: 8px; margin-left: auto;
    }

    .seg {
      display: inline-flex; border: 1px solid var(--line);
      border-radius: 6px; overflow: hidden;
      background: var(--card);
    }
    .seg button {
      padding: 4px 9px; font-size: 11px; font-weight: 600;
      color: var(--muted); border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: none; }
    .seg button.active { background: var(--ink); color: #fff; }
    .seg button:hover:not(.active) { background: var(--bg-soft); color: var(--ink-2); }

    .filter-summary {
      font-size: 11px; color: var(--muted);
      padding: 4px 10px;
      background: var(--bg-soft);
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* --- Tabs --- */
    .tabs {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 0 28px;
      display: flex; gap: 0;
      overflow-x: auto;
    }
    .tab-btn {
      padding: 11px 14px;
      font-size: 12px; font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all .12s ease;
    }
    .tab-btn:hover { color: var(--ink-2); }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent-2);
    }
    .tab-btn .count {
      display: inline-block; margin-left: 4px;
      padding: 1px 6px; border-radius: 10px;
      font-size: 10px; font-weight: 700;
      background: var(--bg-soft); color: var(--muted);
    }
    .tab-btn.active .count { background: var(--accent-soft); color: var(--accent); }

    /* --- Main --- */
    .main { padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 20px; }

    /* --- KPI --- */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
    }
    .kpi {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }
    .kpi::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--accent-2);
    }
    .kpi.kpi-alt::before { background: var(--success); }
    .kpi.kpi-warn::before { background: var(--warning); }
    .kpi.kpi-danger::before { background: var(--danger); }
    .kpi.kpi-violet::before { background: var(--violet); }
    .kpi.kpi-neutral::before { background: #cbd5e1; }
    .kpi-label {
      font-size: 10px; font-weight: 700; letter-spacing: .05em;
      text-transform: uppercase; color: var(--muted);
      margin-bottom: 6px;
    }
    .kpi-value {
      font-size: 20px; font-weight: 700; letter-spacing: -.02em;
      color: var(--ink); font-variant-numeric: tabular-nums;
    }
    .kpi-sub {
      font-size: 11px; color: var(--muted); margin-top: 3px;
      font-variant-numeric: tabular-nums;
    }
    .kpi-sub .pos { color: var(--success); font-weight: 600; }
    .kpi-sub .neg { color: var(--danger); font-weight: 600; }

    /* --- Card --- */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-xs);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--ink); margin: 0; letter-spacing: -.005em; }
    .card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .card-actions { display: flex; gap: 6px; align-items: center; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 1100px) { .grid-2, .grid-3, .grid-2-1 { grid-template-columns: 1fr; } }

    /* --- Tables --- */
    .tbl-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    .tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .tbl th {
      position: sticky; top: 0;
      background: var(--bg-soft);
      padding: 8px 12px; text-align: left;
      font-weight: 600; font-size: 10px;
      text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      z-index: 1;
    }
    .tbl th.sortable { cursor: pointer; user-select: none; }
    .tbl th.sortable:hover { color: var(--ink-2); background: #e2e8f0; }
    .tbl th.num, .tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .tbl td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--line-2);
      white-space: nowrap;
    }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover td { background: var(--bg-soft); }
    .tbl tbody tr.clickable { cursor: pointer; }
    .tbl tbody tr.clickable:hover td { background: var(--accent-soft); }
    .tbl .rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 28px; }
    .tbl .truncate { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    .tbl .num strong { font-weight: 700; }
    .tbl .neg { color: var(--danger); }
    .tbl .pos { color: var(--success); }

    .bar-cell {
      position: relative; min-width: 100px;
      height: 16px; display: flex; align-items: center;
    }
    .bar-cell .bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--accent-2), var(--accent));
      border-radius: 3px; opacity: .15;
    }
    .bar-cell .bar.neg-bar { background: linear-gradient(90deg, #fca5a5, var(--danger)); }
    .bar-cell span { position: relative; z-index: 1; padding-right: 6px; font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px; font-weight: 600;
      background: var(--bg-soft); color: var(--muted);
    }
    .badge.ftt { background: var(--accent-soft); color: var(--accent); }
    .badge.nc { background: var(--danger-soft); color: var(--danger); }
    .badge.rec { background: var(--success-soft); color: var(--success); }
    .badge.back { background: var(--violet-soft); color: var(--violet); }
    .badge.open { background: var(--warning-soft); color: var(--warning); }
    .badge.closed { background: var(--success-soft); color: var(--success); }
    .badge.outlier { background: #fef2f2; color: #9b1c1c; }

    .empty {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-size: 13px;
    }

    /* --- Tooltip --- */
    .custom-tt {
      background: #0b1220; color: #fff;
      padding: 10px 12px; border-radius: 8px;
      font-size: 11px; box-shadow: var(--shadow-lg);
      min-width: 160px;
    }
    .custom-tt .tt-title { font-weight: 700; margin-bottom: 6px; font-size: 12px; color: #f1f5f9; }
    .custom-tt .tt-row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .custom-tt .tt-row .k { color: #94a3b8; }
    .custom-tt .tt-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .custom-tt .tt-click { margin-top: 6px; padding-top: 6px; border-top: 1px solid #334155; color: #93c5fd; font-size: 10px; }

    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 10px 16px;
      font-size: 11px; color: var(--muted);
      margin-top: 8px;
    }
    .chart-legend-item { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
    .chart-legend-item:hover { background: var(--bg-soft); }
    .chart-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

    .muted { color: var(--muted); }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .pagination .pager { display: flex; gap: 4px; }

    /* --- Modal --- */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.5); backdrop-filter: blur(4px);
      display: grid; place-items: center;
      z-index: 100; padding: 20px;
      animation: fadeIn .15s ease;
    }
    .modal {
      background: var(--card); border-radius: 12px;
      width: 100%; max-width: 1200px; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: slideUp .2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .modal-head {
      padding: 18px 24px; border-bottom: 1px solid var(--line);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .modal-head h3 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .modal-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    .modal-body { padding: 18px 24px; overflow: auto; flex: 1; }
    .modal-foot {
      padding: 12px 24px; border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-soft); font-size: 11px; color: var(--muted);
    }
    .icon-btn {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 6px; color: var(--muted);
      transition: all .12s ease;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--ink-2); }

    /* --- Charts interactive --- */
    .recharts-bar-rectangle, .recharts-pie-sector, .recharts-layer { cursor: pointer; }
    .recharts-tooltip-wrapper { outline: none !important; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* --- Histogram custom bars --- */
    .hist { display: flex; align-items: flex-end; gap: 2px; height: 160px; margin-top: 8px; padding: 0 4px; }
    .hist-bar { flex: 1; background: linear-gradient(180deg, var(--accent-2), var(--accent)); border-radius: 3px 3px 0 0; position: relative; transition: all .15s; cursor: pointer; min-height: 2px; }
    .hist-bar:hover { opacity: .8; transform: translateY(-2px); }
    .hist-axis { display: flex; gap: 2px; padding: 4px; font-size: 9px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
    .hist-axis span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .drill-hint {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10px; color: var(--accent);
      font-weight: 500;
      padding: 3px 8px;
      background: var(--accent-soft);
      border-radius: 10px;
    }
    .drill-hint::before { content: '→'; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useMemo, useCallback, useEffect, useRef } = React;
    const {
      BarChart, Bar, LineChart, Line, AreaChart, Area,
      PieChart, Pie, Cell, ComposedChart, ScatterChart, Scatter, ZAxis,
      XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, LabelList, ReferenceLine
    } = Recharts;

    // ============== Constants ==============
    const MONTHS_IT = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
    const PALETTE = [
      '#1e40af', '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b',
      '#10b981', '#06b6d4', '#6366f1', '#f43f5e', '#84cc16',
      '#a855f7', '#eab308', '#0ea5e9', '#22c55e', '#fb923c'
    ];
    const OUTLIER_DATE = '2000-01-01';

    // ============== Formatters ==============
    const fmtEur = (v, d=0) => new Intl.NumberFormat('it-IT', { style:'currency', currency:'EUR', maximumFractionDigits:d, minimumFractionDigits:d }).format(v || 0);
    const fmtEurShort = (v) => {
      const n = Number(v) || 0;
      const a = Math.abs(n);
      if (a >= 1e6) return (n/1e6).toLocaleString('it-IT', {maximumFractionDigits:1}) + 'M €';
      if (a >= 1e3) return Math.round(n/1e3).toLocaleString('it-IT') + 'k €';
      return fmtEur(n);
    };
    const fmtNum = (v) => new Intl.NumberFormat('it-IT').format(v || 0);
    const fmtDec = (v, d=1) => new Intl.NumberFormat('it-IT', { maximumFractionDigits: d, minimumFractionDigits: d }).format(v || 0);
    const fmtPct = (v, d=1) => new Intl.NumberFormat('it-IT', { style:'percent', maximumFractionDigits:d }).format(v || 0);
    const fmtDays = (v) => v == null ? '—' : `${fmtDec(v, 0)} gg`;
    const fmtHours = (v) => v == null ? '—' : `${fmtDec(v, 1)} h`;

    // ============== Date utils ==============
    const parseDate = (v) => {
      if (v == null || v === '') return null;
      if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
      if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400 * 1000)); return isNaN(d.getTime()) ? null : d; }
      const d = new Date(v);
      return isNaN(d.getTime()) ? null : d;
    };
    const isoDate = (d) => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : '';
    const formatDate = (d) => d ? d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
    const monthKey = (d) => d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}` : '';
    const monthLabel = (k) => { if (!k) return ''; const [y,m] = k.split('-'); return `${MONTHS_IT[+m-1]} '${y.slice(2)}`; };
    const monthLabelLong = (k) => { if (!k) return ''; const [y,m] = k.split('-'); return `${MONTHS_IT[+m-1]} ${y}`; };
    const fromMonthInput = (s) => { if (!s) return null; const [y,m] = s.split('-'); return new Date(+y, +m-1, 1); };
    const isOutlier = (d) => d && isoDate(d) === OUTLIER_DATE;
    const daysBetween = (from, to) => {
      if (!from || !to) return null;
      return Math.round((to.getTime() - from.getTime()) / (1000 * 60 * 60 * 24));
    };

    // ============== Data loading ==============
    const KEYS = {
      FY: ['FY'],
      NEW_BACK: ['NEW_BACK', 'NEW-BACK'],
      TIPO_DOC: ['TIPO DOC', 'TIPO_DOC', 'TIPODOC'],
      COMPANY: ['COMPANY'],
      GRUPPO: ['GRUPPO'],
      LINES: ['LINES'],
      LINES_PRECISO: ['LINES PRECISO', 'LINES_PRECISO'],
      ID_PRATICA: ['ID PRATICA', 'ID_PRATICA'],
      SALES: ['SALES'],
      CONSULTANT: ['CONSULTANT'],
      TYPOLOGY: ['TYPOLOGY'],
      INVOICED: ['INVOICED'],
      MONTH: ['MONTH'],
      TYPE_FRANCE: ['Type France', 'TYPE FRANCE'],
      CONTRIBUTO: ['Contributo ottenuto', 'CONTRIBUTO OTTENUTO'],
      FAMILY: ['FAMILY'],
      SERVICE_MODE: ['SERVICE MODE', 'SERVICE_MODE'],
      ORE: ['ORE LAVORATE', 'ORE_LAVORATE'],
      DATA_AVVIO: ['Data avvio attività', 'DATA_AVVIO_ATTIVITA', 'DATA AVVIO ATTIVITÀ', 'DATA AVVIO ATTIVITA'],
      DATA_CHIUSURA: ['Data chiusura effettiva', 'DATA_CHIUSURA_EFFETTIVA', 'DATA CHIUSURA EFFETTIVA'],
    };

    const findKey = (headers, alts) => {
      const headersLower = headers.map(h => String(h).toLowerCase().trim());
      for (const alt of alts) {
        const idx = headersLower.indexOf(String(alt).toLowerCase().trim());
        if (idx !== -1) return headers[idx];
      }
      return null;
    };

    const REQUIRED = ['FY', 'COMPANY', 'INVOICED', 'ID_PRATICA'];

    const findHeaderRow = (rawRows) => {
      for (let i = 0; i < Math.min(15, rawRows.length); i++) {
        const r = rawRows[i] || [];
        const strs = r.map(c => (c==null?'':String(c).trim()));
        let matches = 0;
        for (const key of REQUIRED) {
          const alts = KEYS[key];
          if (alts.some(a => strs.includes(a))) matches++;
        }
        if (matches === REQUIRED.length) return i;
      }
      return -1;
    };

    const loadExcel = async (file) => {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { cellDates: true });
      const target = wb.SheetNames.find(n => n.toLowerCase().replace(/\s+/g,'') === 'tab_ftt_x_lines')
        || wb.SheetNames.find(n => n.toLowerCase().includes('tab_ftt_x_lines'))
        || wb.SheetNames.find(n => n.toLowerCase().includes('tab_ftt'))
        || wb.SheetNames[0];
      const sheet = wb.Sheets[target];
      const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
      const hIdx = findHeaderRow(rawRows);
      if (hIdx === -1) throw new Error(`Intestazione non trovata nel foglio "${target}". Sono richieste le colonne FY, COMPANY, ID PRATICA, INVOICED.`);
      const headers = rawRows[hIdx].map(h => (h == null ? '' : String(h).trim()));

      // Mappa chiavi logiche → chiavi reali nel file
      const keyMap = {};
      for (const [logic, alts] of Object.entries(KEYS)) {
        keyMap[logic] = findKey(headers, alts);
      }

      const rows = [];
      for (let i = hIdx + 1; i < rawRows.length; i++) {
        const row = rawRows[i];
        if (!row || row.every(c => c == null || c === '')) continue;
        const obj = {};
        headers.forEach((h, j) => { obj[h] = row[j]; });
        const fy = obj[keyMap.FY];
        const company = obj[keyMap.COMPANY];
        if (!fy || !company) continue;
        const r = {
          fy: String(fy).trim(),
          newBack: keyMap.NEW_BACK ? (obj[keyMap.NEW_BACK] ? String(obj[keyMap.NEW_BACK]).trim() : null) : null,
          tipoDoc: keyMap.TIPO_DOC ? (obj[keyMap.TIPO_DOC] ? String(obj[keyMap.TIPO_DOC]).trim().toUpperCase() : null) : null,
          company: String(company).trim(),
          gruppo: keyMap.GRUPPO ? (obj[keyMap.GRUPPO] ? String(obj[keyMap.GRUPPO]).trim() : null) : null,
          lines: keyMap.LINES ? (obj[keyMap.LINES] ? String(obj[keyMap.LINES]).trim() : null) : null,
          linesPreciso: keyMap.LINES_PRECISO ? (obj[keyMap.LINES_PRECISO] ? String(obj[keyMap.LINES_PRECISO]).trim() : null) : null,
          idPratica: keyMap.ID_PRATICA ? (obj[keyMap.ID_PRATICA] ? String(obj[keyMap.ID_PRATICA]).trim() : null) : null,
          sales: keyMap.SALES ? (obj[keyMap.SALES] ? String(obj[keyMap.SALES]).trim() : null) : null,
          consultant: keyMap.CONSULTANT ? (obj[keyMap.CONSULTANT] ? String(obj[keyMap.CONSULTANT]).trim() : null) : null,
          typology: keyMap.TYPOLOGY ? (obj[keyMap.TYPOLOGY] ? String(obj[keyMap.TYPOLOGY]).trim() : null) : null,
          invoiced: Number(obj[keyMap.INVOICED]) || 0,
          month: parseDate(obj[keyMap.MONTH]),
          typeFrance: keyMap.TYPE_FRANCE ? (obj[keyMap.TYPE_FRANCE] ? String(obj[keyMap.TYPE_FRANCE]).trim() : null) : null,
          contributo: keyMap.CONTRIBUTO ? (Number(obj[keyMap.CONTRIBUTO]) || 0) : 0,
          family: keyMap.FAMILY ? (obj[keyMap.FAMILY] && obj[keyMap.FAMILY] !== 0 ? String(obj[keyMap.FAMILY]).trim() : 'n.d.') : 'n.d.',
          serviceMode: keyMap.SERVICE_MODE ? (obj[keyMap.SERVICE_MODE] && obj[keyMap.SERVICE_MODE] !== 0 ? String(obj[keyMap.SERVICE_MODE]).trim() : 'n.d.') : 'n.d.',
          ore: keyMap.ORE ? (Number(obj[keyMap.ORE]) || 0) : 0,
          dataAvvio: keyMap.DATA_AVVIO ? parseDate(obj[keyMap.DATA_AVVIO]) : null,
          dataChiusura: keyMap.DATA_CHIUSURA ? parseDate(obj[keyMap.DATA_CHIUSURA]) : null,
        };
        // Desume TIPO_DOC dal segno se mancante
        if (!r.tipoDoc) r.tipoDoc = r.invoiced < 0 ? 'NC' : 'FTT';
        r.__mk = monthKey(r.month);
        rows.push(r);
      }
      return { rows, sheet: target, headers, keyMap };
    };

    // ============== Aggregation: docs → pratiche ==============
    // Aggregates all rows (documents) into practice-level records.
    // Logic:
    //   - netto economico = somma algebrica INVOICED (FTT+, NC-)
    //   - doc di riferimento = ultima FTT cronologica (MONTH desc); fallback: ultima riga
    //   - attributi pratica (ore, date, sales, consultant, typology...) = primo valore costante
    //   - durata = dataChiusura - dataAvvio (null se outlier o mancante)
    const aggregatePratiche = (rows) => {
      const map = new Map();
      for (const r of rows) {
        const key = r.idPratica || `__unkeyed_${r.company}_${r.lines}_${r.__mk}_${Math.random().toString(36).slice(2,8)}`;
        let p = map.get(key);
        if (!p) {
          p = {
            idPratica: r.idPratica || '(senza ID)',
            company: r.company,
            gruppo: r.gruppo,
            lines: r.lines,
            linesPreciso: r.linesPreciso,
            sales: r.sales,
            consultant: r.consultant,
            typology: r.typology,
            family: r.family,
            typeFrance: r.typeFrance,
            serviceMode: r.serviceMode,
            newBack: r.newBack,
            fy: r.fy,
            contributo: r.contributo,
            ore: r.ore,
            dataAvvio: r.dataAvvio,
            dataChiusura: r.dataChiusura,
            // aggregated
            netto: 0,
            totFtt: 0,
            totNc: 0,
            nFtt: 0,
            nNc: 0,
            nDocs: 0,
            hasNc: false,
            docs: [],
            lastFttDate: null,
            lastFttMk: null,
            lastFtt: null,  // doc di riferimento
            firstFyAppearance: r.fy,
            lastFyAppearance: r.fy,
          };
          map.set(key, p);
        }
        // accumulate
        p.netto += r.invoiced;
        p.nDocs += 1;
        p.docs.push(r);
        if (r.tipoDoc === 'NC') {
          p.totNc += r.invoiced;
          p.nNc += 1;
          p.hasNc = true;
        } else {
          p.totFtt += r.invoiced;
          p.nFtt += 1;
          // ultima FTT cronologica (by MONTH, tiebreaker by invoiced desc)
          const t = r.month ? r.month.getTime() : 0;
          const currentT = p.lastFttDate ? p.lastFttDate.getTime() : -Infinity;
          if (t > currentT || (t === currentT && r.invoiced > (p.lastFtt?.invoiced || -Infinity))) {
            p.lastFttDate = r.month;
            p.lastFttMk = r.__mk;
            p.lastFtt = r;
          }
        }
        // Keep the "best" non-null attribute values (prefer FTT data over NC)
        if (r.tipoDoc !== 'NC') {
          if (!p.dataAvvio && r.dataAvvio) p.dataAvvio = r.dataAvvio;
          if (!p.dataChiusura && r.dataChiusura) p.dataChiusura = r.dataChiusura;
        }
        if (r.fy) {
          if (!p.firstFyAppearance || r.fy < p.firstFyAppearance) p.firstFyAppearance = r.fy;
          if (!p.lastFyAppearance || r.fy > p.lastFyAppearance) p.lastFyAppearance = r.fy;
        }
      }
      // post-process
      const result = [];
      for (const p of map.values()) {
        p.docs.sort((a,b) => (a.month?.getTime() || 0) - (b.month?.getTime() || 0));
        p.avvioIsOutlier = isOutlier(p.dataAvvio);
        // durata (esclusi outlier)
        if (!p.avvioIsOutlier && p.dataAvvio && p.dataChiusura) {
          p.durataGiorni = daysBetween(p.dataAvvio, p.dataChiusura);
        } else {
          p.durataGiorni = null;
        }
        p.isChiusa = !!p.dataChiusura;
        p.eurPerOra = p.ore > 0 ? p.netto / p.ore : null;
        // Il doc di riferimento: ultima FTT, se assente prendi ultimo doc qualsiasi
        if (!p.lastFtt) {
          const last = p.docs[p.docs.length - 1];
          p.lastFttDate = last?.month;
          p.lastFttMk = last?.__mk;
          p.lastFtt = last;
        }
        result.push(p);
      }
      return result;
    };

    // Group by util (works on any array, produces {key, value, count, ...})
    const groupBy = (arr, keyFn, valFn = r => r.netto) => {
      const m = new Map();
      for (const r of arr) {
        const k = keyFn(r);
        if (k == null || k === '') continue;
        const e = m.get(k) || { key: k, value: 0, count: 0, ore: 0, netto: 0, totFtt: 0, totNc: 0, contributo: 0, durataSum: 0, durataN: 0 };
        e.value += valFn(r);
        e.netto += r.netto || 0;
        e.totFtt += r.totFtt || 0;
        e.totNc += r.totNc || 0;
        e.count += 1;
        e.ore += r.ore || 0;
        e.contributo += r.contributo || 0;
        if (r.durataGiorni != null) { e.durataSum += r.durataGiorni; e.durataN += 1; }
        m.set(k, e);
      }
      // compute averages
      for (const e of m.values()) {
        e.durataMedia = e.durataN > 0 ? e.durataSum / e.durataN : null;
        e.avgOre = e.count > 0 ? e.ore / e.count : 0;
        e.eurPerOra = e.ore > 0 ? e.netto / e.ore : null;
      }
      return Array.from(m.values());
    };

    // ============== UI Components ==============

    const Icon = ({ name, size = 16 }) => {
      const paths = {
        upload: 'M12 16V4m0 0L7 9m5-5l5 5M3 20h18',
        file: 'M14 3v5h5M9 3h5l5 5v12a2 2 0 01-2 2H9a2 2 0 01-2-2V5a2 2 0 012-2z',
        chart: 'M3 3v18h18M8 13v5M13 9v9M18 5v13',
        users: 'M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75',
        briefcase: 'M20 7H4a2 2 0 00-2 2v11a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16',
        clock: 'M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2',
        hourglass: 'M6 2h12M6 22h12M6 2v4a6 6 0 006 6 6 6 0 006-6V2M6 22v-4a6 6 0 016-6 6 6 0 016 6v4',
        receipt: 'M21 9v10a2 2 0 01-2 2H5a2 2 0 01-2-2V9m6-5h6a2 2 0 012 2v2H7V6a2 2 0 012-2zM3 9l9-6 9 6',
        table: 'M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18',
        x: 'M18 6L6 18M6 6l12 12',
        search: 'M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 1010.5 17 6.5 6.5 0 0017 10.5z',
        download: 'M12 3v12m0 0l-5-5m5 5l5-5M4 21h16',
        trend: 'M22 7L13.5 15.5 8.5 10.5 2 17M16 7h6v6',
        award: 'M12 15a7 7 0 100-14 7 7 0 000 14zM8.21 13.89L7 22l5-3 5 3-1.21-8.11',
        layers: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5',
        package: 'M12 2l9 5v10l-9 5-9-5V7l9-5zM3.3 7l8.7 5 8.7-5M12 22V12',
        euro: 'M21 11a8 8 0 01-14.83 4M3 14c0-5 4-9 9-9m-8 1h7M4 10h7',
        eye: 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8zM12 15a3 3 0 100-6 3 3 0 000 6z',
        alert: 'M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z',
      };
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d={paths[name]} />
        </svg>
      );
    };

    const Upload = ({ onFile, error, loading }) => {
      const [drag, setDrag] = useState(false);
      const inputRef = useRef(null);
      const onDrop = (e) => {
        e.preventDefault(); setDrag(false);
        const f = e.dataTransfer.files[0];
        if (f) onFile(f);
      };
      return (
        <div className="upload-wrap">
          <div
            className={`upload ${drag ? 'drag' : ''}`}
            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={onDrop}
          >
            <div className="upload-icon"><Icon name="upload" size={26} /></div>
            <h2>Carica il file Fatture.xlsx</h2>
            <p>Trascina qui il file Excel oppure seleziona dal disco.<br/>Verrà letto automaticamente il foglio <strong>tab_ftt_x_lines</strong>.</p>
            <div className="upload-cta">
              <button className="btn btn-primary" onClick={() => inputRef.current?.click()}>
                <Icon name="file" size={14} /> {loading ? 'Caricamento...' : 'Seleziona file'}
              </button>
            </div>
            <div className="upload-hint">.xlsx · .xlsm · elaborazione locale nel browser</div>
            <input ref={inputRef} type="file" accept=".xlsx,.xlsm,.xls" onChange={e => e.target.files[0] && onFile(e.target.files[0])} />
            <div className="req-list">
              <strong>Campi previsti sul foglio:</strong><br/>
              <code>FY</code> · <code>TIPO DOC</code> <span className="muted">(FTT/NC)</span> · <code>COMPANY</code> · <code>ID PRATICA</code> · <code>SALES</code> · <code>CONSULTANT</code> · <code>TYPOLOGY</code> · <code>INVOICED</code> · <code>MONTH</code> · <code>ORE LAVORATE</code> · <code>Data avvio attività</code> · <code>Data chiusura effettiva</code>
              <br/><br/>
              <span className="muted">I record con <code>Data avvio = 01/01/2000</code> sono trattati come outlier ed esclusi dal calcolo dei tempi medi di lavorazione.</span>
            </div>
            {error && <div className="err">{error}</div>}
          </div>
        </div>
      );
    };

    const ChipSelect = ({ options, value, onChange, allLabel = 'Tutti' }) => {
      const toggle = (v) => {
        if (value.includes(v)) onChange(value.filter(x => x !== v));
        else onChange([...value, v]);
      };
      return (
        <div className="chip-row">
          <button className={`chip ${value.length === 0 ? 'active' : ''}`} onClick={() => onChange([])}>{allLabel}</button>
          {options.map(o => (
            <button key={o} className={`chip ${value.includes(o) ? 'active' : ''}`} onClick={() => toggle(o)}>{o}</button>
          ))}
        </div>
      );
    };

    const Kpi = ({ label, value, sub, variant, subVariant }) => (
      <div className={`kpi ${variant ? 'kpi-' + variant : ''}`}>
        <div className="kpi-label">{label}</div>
        <div className="kpi-value">{value}</div>
        {sub && <div className="kpi-sub"><span className={subVariant || ''}>{sub}</span></div>}
      </div>
    );

    const TT = ({ active, payload, label, title, valueFmt = fmtEur, clickable = false }) => {
      if (!active || !payload || !payload.length) return null;
      return (
        <div className="custom-tt">
          <div className="tt-title">{title ? title(label) : label}</div>
          {payload.map((p, i) => (
            <div className="tt-row" key={i}>
              <span className="k" style={{color: p.color || p.stroke || '#94a3b8'}}>■ {p.name}</span>
              <span className="v">{valueFmt(p.value)}</span>
            </div>
          ))}
          {clickable && <div className="tt-click">Click per dettaglio pratiche →</div>}
        </div>
      );
    };

    // ============== Practice Detail Modal ==============

    const PraticheModal = ({ title, subtitle, pratiche, onClose }) => {
      const [sortBy, setSortBy] = useState('netto');
      const [sortDir, setSortDir] = useState('desc');

      const sorted = useMemo(() => {
        const arr = [...pratiche];
        arr.sort((a,b) => {
          let va = a[sortBy], vb = b[sortBy];
          if (va instanceof Date) va = va.getTime();
          if (vb instanceof Date) vb = vb.getTime();
          if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va - vb : vb - va;
          va = va == null ? '' : String(va); vb = vb == null ? '' : String(vb);
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        return arr;
      }, [pratiche, sortBy, sortDir]);

      const setSort = (k) => {
        if (sortBy === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortBy(k); setSortDir('desc'); }
      };

      const totals = useMemo(() => {
        const tot = pratiche.reduce((s,p) => s + p.netto, 0);
        const ore = pratiche.reduce((s,p) => s + (p.ore || 0), 0);
        const chiuse = pratiche.filter(p => p.isChiusa).length;
        const conNc = pratiche.filter(p => p.hasNc).length;
        const durate = pratiche.filter(p => p.durataGiorni != null).map(p => p.durataGiorni);
        const durMedia = durate.length ? durate.reduce((a,b) => a+b, 0) / durate.length : null;
        return { tot, ore, chiuse, conNc, durMedia, total: pratiche.length };
      }, [pratiche]);

      const exportCsv = () => {
        const headers = ['ID PRATICA','COMPANY','GRUPPO','LINES','TYPOLOGY','FAMILY','SALES','CONSULTANT','FY','NEW_BACK','SERVICE MODE','N DOCS','N FTT','N NC','HAS NC','TOT FTT','TOT NC','NETTO','ORE','EUR/H','DATA AVVIO','DATA CHIUSURA','DURATA GG','AVVIO OUTLIER','CONTRIBUTO','ULTIMA FTT','ULTIMA FTT EURO'];
        const rows = sorted.map(p => [
          p.idPratica, p.company, p.gruppo, p.lines, p.typology, p.family,
          p.sales, p.consultant, p.fy, p.newBack, p.serviceMode,
          p.nDocs, p.nFtt, p.nNc, p.hasNc ? 'SI' : 'NO',
          p.totFtt, p.totNc, p.netto, p.ore, p.eurPerOra != null ? p.eurPerOra : '',
          isoDate(p.dataAvvio), isoDate(p.dataChiusura), p.durataGiorni != null ? p.durataGiorni : '',
          p.avvioIsOutlier ? 'SI' : 'NO', p.contributo,
          p.lastFtt ? (p.lastFtt.lines || '') : '', p.lastFtt ? p.lastFtt.invoiced : ''
        ]);
        const esc = (v) => {
          if (v == null) return '';
          const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
          return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
        };
        const lines = [headers.join(';')];
        for (const r of rows) lines.push(r.map(esc).join(';'));
        const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `pratiche_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const SI = ({ col }) => sortBy !== col ? null : <span style={{marginLeft: 3, color: '#3b82f6'}}>{sortDir === 'asc' ? '↑' : '↓'}</span>;

      return (
        <div className="modal-backdrop" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-head">
              <div>
                <h3>{title}</h3>
                <p>{subtitle}</p>
              </div>
              <button className="icon-btn" onClick={onClose} aria-label="Chiudi"><Icon name="x" /></button>
            </div>
            <div className="modal-body">
              <div className="kpi-grid" style={{marginBottom: 14}}>
                <Kpi label="Pratiche" value={fmtNum(totals.total)} />
                <Kpi label="Netto totale" value={fmtEur(totals.tot)} variant="alt" />
                <Kpi label="Ore" value={fmtHours(totals.ore)} variant="violet" />
                <Kpi label="Durata media" value={fmtDays(totals.durMedia)} variant="warn" sub={`su chiuse non-outlier`} />
                <Kpi label="Chiuse" value={`${totals.chiuse}/${totals.total}`} variant="neutral" />
                <Kpi label="Con NC" value={fmtNum(totals.conNc)} variant={totals.conNc > 0 ? 'danger' : 'neutral'} />
              </div>

              <div className="tbl-wrap" style={{maxHeight: 480}}>
                <table className="tbl">
                  <thead>
                    <tr>
                      <th className="sortable" onClick={() => setSort('idPratica')}>ID Pratica<SI col="idPratica" /></th>
                      <th className="sortable" onClick={() => setSort('company')}>Cliente<SI col="company" /></th>
                      <th className="sortable" onClick={() => setSort('typology')}>Typology<SI col="typology" /></th>
                      <th className="sortable" onClick={() => setSort('sales')}>Sales<SI col="sales" /></th>
                      <th className="sortable" onClick={() => setSort('consultant')}>Tech<SI col="consultant" /></th>
                      <th className="sortable" onClick={() => setSort('fy')}>FY<SI col="fy" /></th>
                      <th className="num sortable" onClick={() => setSort('nDocs')}>Doc<SI col="nDocs" /></th>
                      <th className="num sortable" onClick={() => setSort('totFtt')}>FTT<SI col="totFtt" /></th>
                      <th className="num sortable" onClick={() => setSort('totNc')}>NC<SI col="totNc" /></th>
                      <th className="num sortable" onClick={() => setSort('netto')}>Netto<SI col="netto" /></th>
                      <th className="num sortable" onClick={() => setSort('ore')}>Ore<SI col="ore" /></th>
                      <th className="num sortable" onClick={() => setSort('eurPerOra')}>€/h<SI col="eurPerOra" /></th>
                      <th className="sortable" onClick={() => setSort('dataAvvio')}>Avvio<SI col="dataAvvio" /></th>
                      <th className="sortable" onClick={() => setSort('dataChiusura')}>Chiusura<SI col="dataChiusura" /></th>
                      <th className="num sortable" onClick={() => setSort('durataGiorni')}>Durata<SI col="durataGiorni" /></th>
                    </tr>
                  </thead>
                  <tbody>
                    {sorted.length === 0 && <tr><td colSpan="15" className="empty">Nessuna pratica</td></tr>}
                    {sorted.map((p, i) => (
                      <tr key={i}>
                        <td className="mono truncate" title={p.idPratica} style={{maxWidth: 220, fontSize: 11}}>{p.idPratica}</td>
                        <td className="truncate" title={p.company} style={{maxWidth: 180}}>{p.company}</td>
                        <td>{p.typology || '—'}</td>
                        <td>{p.sales || '—'}</td>
                        <td className="muted">{p.consultant || '—'}</td>
                        <td><span className="badge">{p.fy}</span></td>
                        <td className="num">
                          {p.nDocs}
                          {p.hasNc && <span className="badge nc" style={{marginLeft: 4}}>NC</span>}
                        </td>
                        <td className="num muted">{p.totFtt ? fmtEurShort(p.totFtt) : '—'}</td>
                        <td className="num neg">{p.totNc ? fmtEurShort(p.totNc) : '—'}</td>
                        <td className="num"><strong className={p.netto < 0 ? 'neg' : ''}>{fmtEur(p.netto)}</strong></td>
                        <td className="num">{p.ore > 0 ? fmtDec(p.ore, 1) : '—'}</td>
                        <td className="num muted">{p.eurPerOra != null ? fmtEur(p.eurPerOra) : '—'}</td>
                        <td className="muted">
                          {p.dataAvvio ? formatDate(p.dataAvvio) : '—'}
                          {p.avvioIsOutlier && <span className="badge outlier" style={{marginLeft: 4}}>outlier</span>}
                        </td>
                        <td className="muted">{p.dataChiusura ? formatDate(p.dataChiusura) : <span className="badge open">aperta</span>}</td>
                        <td className="num">{p.durataGiorni != null ? fmtDays(p.durataGiorni) : '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
            <div className="modal-foot">
              <span>{fmtNum(pratiche.length)} pratiche · click sulle intestazioni per ordinare</span>
              <button className="btn btn-primary btn-sm" onClick={exportCsv}>
                <Icon name="download" size={12} /> Esporta CSV
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ============== Interactive Chart Helper ==============
    const makeBarClick = (drill) => (e) => {
      if (e && e.activeLabel != null) drill(e.activeLabel);
    };

    // ============== VIEWS ==============

    // --- Overview tab ---
    const OverviewView = ({ pratiche, docs, onDrill }) => {
      // Monthly series (based on docs to get month distribution of FTT/NC)
      const monthly = useMemo(() => {
        const m = new Map();
        for (const d of docs) {
          if (!d.__mk) continue;
          const e = m.get(d.__mk) || { key: d.__mk, label: monthLabel(d.__mk), ftt: 0, nc: 0, net: 0, n: 0 };
          if (d.tipoDoc === 'NC') e.nc += d.invoiced; else e.ftt += d.invoiced;
          e.net += d.invoiced;
          e.n += 1;
          m.set(d.__mk, e);
        }
        return Array.from(m.values()).sort((a,b) => a.key.localeCompare(b.key));
      }, [docs]);

      // Per FY netto
      const perFY = useMemo(() => {
        return groupBy(pratiche, p => p.fy).sort((a,b) => a.key.localeCompare(b.key));
      }, [pratiche]);

      // Cumulative per FY per month-in-FY
      const fyCumul = useMemo(() => {
        const fys = {};
        const sorted = [...docs].filter(r => r.month && r.fy).sort((a,b) => a.month - b.month);
        for (const r of sorted) {
          if (!fys[r.fy]) fys[r.fy] = {};
          fys[r.fy][r.__mk] = (fys[r.fy][r.__mk] || 0) + r.invoiced;
        }
        const result = {};
        for (const fy of Object.keys(fys)) {
          const months = Object.keys(fys[fy]).sort();
          let cum = 0;
          result[fy] = months.map(mk => { cum += fys[fy][mk]; return { monthKey: mk, month: monthLabel(mk), cum }; });
        }
        return result;
      }, [docs]);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: 20}}>
          <div className="card">
            <div className="card-head">
              <div>
                <h3 className="card-title">Andamento mensile · FTT, NC e netto</h3>
                <div className="card-sub">Serie temporale · click sulle barre per vedere le pratiche del mese</div>
              </div>
              <span className="drill-hint">clic-attivo</span>
            </div>
            <ResponsiveContainer width="100%" height={320}>
              <ComposedChart data={monthly} margin={{top: 5, right: 20, left: 0, bottom: 0}}
                onClick={(e) => { if (e && e.activeLabel) {
                  const mk = monthly.find(m => m.label === e.activeLabel)?.key;
                  if (mk) onDrill({
                    title: `Pratiche con documenti in ${monthLabelLong(mk)}`,
                    subtitle: `Pratiche con almeno un documento nel mese selezionato`,
                    pratiche: pratiche.filter(p => p.docs.some(d => d.__mk === mk))
                  });
                }}}>
                <CartesianGrid vertical={false} stroke="#eef2f6" />
                <XAxis dataKey="label" tick={{fontSize: 10, fill: '#64748b'}} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                <YAxis tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={fmtEurShort} axisLine={false} tickLine={false} />
                <Tooltip content={<TT clickable />} />
                <Legend wrapperStyle={{fontSize: 11, paddingTop: 6}} iconType="circle" />
                <Bar dataKey="ftt" name="FTT" fill="#3b82f6" radius={[3,3,0,0]} stackId="a" />
                <Bar dataKey="nc" name="NC" fill="#ef4444" radius={[0,0,3,3]} stackId="a" />
                <Line type="monotone" dataKey="net" name="Netto" stroke="#1e40af" strokeWidth={1.6} dot={{r:2}} activeDot={{r:4}} />
                <ReferenceLine y={0} stroke="#94a3b8" strokeDasharray="2 2" />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          <div className="grid-2">
            <div className="card">
              <div className="card-head">
                <div>
                  <h3 className="card-title">Netto per FY</h3>
                  <div className="card-sub">Click su una barra per vedere tutte le pratiche dell'FY</div>
                </div>
                <span className="drill-hint">clic-attivo</span>
              </div>
              <ResponsiveContainer width="100%" height={250}>
                <BarChart data={perFY} margin={{top: 10, right: 10, left: 0, bottom: 0}}
                  onClick={(e) => { if (e && e.activeLabel) onDrill({
                    title: `Pratiche ${e.activeLabel}`,
                    subtitle: `Tutte le pratiche con fatturazione nell'esercizio ${e.activeLabel}`,
                    pratiche: pratiche.filter(p => p.fy === e.activeLabel)
                  }); }}>
                  <CartesianGrid vertical={false} stroke="#eef2f6" />
                  <XAxis dataKey="key" tick={{fontSize: 11, fill: '#64748b'}} axisLine={false} tickLine={false} />
                  <YAxis tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={fmtEurShort} axisLine={false} tickLine={false} />
                  <Tooltip content={<TT clickable />} />
                  <Bar dataKey="value" radius={[6,6,0,0]} name="Netto">
                    {perFY.map((e,i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
                    <LabelList dataKey="value" position="top" formatter={fmtEurShort} style={{fontSize: 10, fill: '#334155', fontWeight: 600}} />
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
            </div>

            <div className="card">
              <div className="card-head">
                <div>
                  <h3 className="card-title">Cumulato per FY</h3>
                  <div className="card-sub">Crescita progressiva per esercizio</div>
                </div>
              </div>
              <ResponsiveContainer width="100%" height={250}>
                <LineChart margin={{top: 10, right: 20, left: 0, bottom: 0}}>
                  <CartesianGrid vertical={false} stroke="#eef2f6" />
                  <XAxis dataKey="month" type="category" allowDuplicatedCategory={false} tick={{fontSize: 10, fill: '#64748b'}} axisLine={false} tickLine={false} />
                  <YAxis tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={fmtEurShort} axisLine={false} tickLine={false} />
                  <Tooltip content={<TT />} />
                  <Legend wrapperStyle={{fontSize: 11, paddingTop: 10}} iconType="circle" />
                  {Object.entries(fyCumul).sort(([a],[b]) => a.localeCompare(b)).map(([fy, pts], i) => (
                    <Line key={fy} data={pts} dataKey="cum" name={fy} stroke={PALETTE[i % PALETTE.length]} strokeWidth={2} dot={{r:2}} activeDot={{r:4}} />
                  ))}
                </LineChart>
              </ResponsiveContainer>
            </div>
          </div>
        </div>
      );
    };

    // --- Ranking view (generic: Sales / Consultant / Typology / Family / TypeFrance) ---
    const RankingView = ({ pratiche, dim, label, onDrill }) => {
      const agg = useMemo(() => groupBy(pratiche, p => p[dim]).sort((a,b) => b.netto - a.netto), [pratiche, dim]);
      const fys = useMemo(() => Array.from(new Set(pratiche.map(p => p.fy))).sort(), [pratiche]);
      const byFY = useMemo(() => {
        const m = {};
        for (const p of pratiche) {
          const k = p[dim];
          if (!k) continue;
          if (!m[k]) m[k] = { key: k };
          m[k][p.fy] = (m[k][p.fy] || 0) + p.netto;
        }
        return Object.values(m).sort((a,b) => {
          const sa = fys.reduce((s,f) => s + (a[f]||0), 0);
          const sb = fys.reduce((s,f) => s + (b[f]||0), 0);
          return sb - sa;
        });
      }, [pratiche, dim, fys]);

      const total = agg.reduce((s,e) => s + e.netto, 0);
      const max = Math.max(...agg.map(e => Math.abs(e.netto)), 1);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: 20}}>
          <div className="card">
            <div className="card-head">
              <div>
                <h3 className="card-title">Ranking {label}</h3>
                <div className="card-sub">{agg.length} voci · click per drill-down</div>
              </div>
              <span className="drill-hint">clic-attivo</span>
            </div>
            <ResponsiveContainer width="100%" height={Math.max(220, agg.length * 34)}>
              <BarChart data={agg} layout="vertical" margin={{top: 5, right: 70, left: 10, bottom: 0}}
                onClick={(e) => { if (e && e.activeLabel) onDrill({
                  title: `${label}: ${e.activeLabel}`,
                  subtitle: `Pratiche attribuite a ${e.activeLabel}`,
                  pratiche: pratiche.filter(p => p[dim] === e.activeLabel)
                }); }}>
                <CartesianGrid horizontal={false} stroke="#eef2f6" />
                <XAxis type="number" tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={fmtEurShort} axisLine={false} tickLine={false} />
                <YAxis type="category" dataKey="key" tick={{fontSize: 11, fill: '#1e293b'}} axisLine={false} tickLine={false} width={130} />
                <Tooltip content={<TT clickable />} />
                <Bar dataKey="netto" radius={[0,4,4,0]} name="Netto">
                  {agg.map((e,i) => <Cell key={i} fill={e.netto < 0 ? '#ef4444' : PALETTE[i % PALETTE.length]} />)}
                  <LabelList dataKey="netto" position="right" formatter={fmtEurShort} style={{fontSize: 10, fill: '#334155', fontWeight: 600}} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>

          <div className="grid-2">
            <div className="card">
              <div className="card-head">
                <div>
                  <h3 className="card-title">Dettaglio metriche {label}</h3>
                  <div className="card-sub">Click su una riga per drill-down</div>
                </div>
              </div>
              <div className="tbl-wrap" style={{maxHeight: 480}}>
                <table className="tbl">
                  <thead>
                    <tr>
                      <th style={{width: 28}}>#</th>
                      <th>{label}</th>
                      <th className="num">Pratiche</th>
                      <th className="num">Netto</th>
                      <th className="num">Ore</th>
                      <th className="num">€/h</th>
                      <th className="num">Durata med</th>
                      <th className="num">% Tot</th>
                    </tr>
                  </thead>
                  <tbody>
                    {agg.map((e,i) => (
                      <tr key={i} className="clickable" onClick={() => onDrill({
                        title: `${label}: ${e.key}`,
                        subtitle: `Pratiche attribuite a ${e.key}`,
                        pratiche: pratiche.filter(p => p[dim] === e.key)
                      })}>
                        <td className="rank">{i+1}</td>
                        <td className="truncate" title={e.key}>{e.key}</td>
                        <td className="num">{fmtNum(e.count)}</td>
                        <td className="num">
                          <div className="bar-cell">
                            <div className={`bar ${e.netto < 0 ? 'neg-bar' : ''}`} style={{width: (Math.abs(e.netto)/max * 100) + '%'}} />
                            <span><strong>{fmtEur(e.netto)}</strong></span>
                          </div>
                        </td>
                        <td className="num">{e.ore > 0 ? fmtDec(e.ore, 0) : '—'}</td>
                        <td className="num muted">{e.eurPerOra != null ? fmtEur(e.eurPerOra) : '—'}</td>
                        <td className="num muted">{e.durataMedia != null ? fmtDays(e.durataMedia) : '—'}</td>
                        <td className="num muted">{total ? fmtPct(e.netto / total) : '—'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="card">
              <div className="card-head">
                <div>
                  <h3 className="card-title">Breakdown per FY</h3>
                  <div className="card-sub">Click su riga per vedere le pratiche</div>
                </div>
              </div>
              <div className="tbl-wrap" style={{maxHeight: 480}}>
                <table className="tbl">
                  <thead>
                    <tr>
                      <th>{label}</th>
                      {fys.map(f => <th key={f} className="num">{f}</th>)}
                      <th className="num">Totale</th>
                    </tr>
                  </thead>
                  <tbody>
                    {byFY.map((r,i) => {
                      const tot = fys.reduce((s,f) => s + (r[f]||0), 0);
                      return (
                        <tr key={i} className="clickable" onClick={() => onDrill({
                          title: `${label}: ${r.key}`,
                          subtitle: `Pratiche attribuite a ${r.key} (tutti gli FY)`,
                          pratiche: pratiche.filter(p => p[dim] === r.key)
                        })}>
                          <td className="truncate" title={r.key}>{r.key}</td>
                          {fys.map(f => <td key={f} className="num muted">{r[f] ? fmtEurShort(r[f]) : '—'}</td>)}
                          <td className="num"><strong>{fmtEurShort(tot)}</strong></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // --- Tempi di lavorazione ---
    const TempiView = ({ pratiche, onDrill }) => {
      const withDuration = useMemo(() => pratiche.filter(p => p.durataGiorni != null), [pratiche]);
      const outliers = useMemo(() => pratiche.filter(p => p.avvioIsOutlier).length, [pratiche]);
      const aperte = useMemo(() => pratiche.filter(p => !p.isChiusa).length, [pratiche]);

      const overallMean = withDuration.length ? withDuration.reduce((s,p) => s + p.durataGiorni, 0) / withDuration.length : null;
      const sortedDur = withDuration.map(p => p.durataGiorni).sort((a,b) => a-b);
      const overallMedian = sortedDur.length ? (sortedDur.length % 2 ? sortedDur[(sortedDur.length-1)/2] : (sortedDur[sortedDur.length/2-1] + sortedDur[sortedDur.length/2])/2) : null;
      const p90 = sortedDur.length ? sortedDur[Math.min(sortedDur.length-1, Math.floor(sortedDur.length * 0.9))] : null;

      // Histogram
      const hist = useMemo(() => {
        if (!withDuration.length) return { bins: [], maxCount: 0 };
        const max = Math.max(...withDuration.map(p => p.durataGiorni));
        const binSize = max > 500 ? 60 : max > 200 ? 30 : 15;
        const nBins = Math.min(25, Math.ceil(max / binSize) + 1);
        const bins = Array.from({length: nBins}, (_, i) => ({
          from: i * binSize,
          to: (i+1) * binSize - 1,
          label: `${i*binSize}–${(i+1)*binSize}`,
          count: 0,
          pratiche: []
        }));
        for (const p of withDuration) {
          const idx = Math.min(nBins - 1, Math.floor(p.durataGiorni / binSize));
          bins[idx].count += 1;
          bins[idx].pratiche.push(p);
        }
        return { bins, maxCount: Math.max(...bins.map(b => b.count), 1) };
      }, [withDuration]);

      // Per typology
      const byTypology = useMemo(() => groupBy(withDuration, p => p.typology).sort((a,b) => (b.durataMedia || 0) - (a.durataMedia || 0)), [withDuration]);

      // Per consultant
      const byConsultant = useMemo(() => groupBy(withDuration, p => p.consultant).sort((a,b) => (b.durataMedia || 0) - (a.durataMedia || 0)), [withDuration]);

      // Scatter: durata vs netto (top points)
      const scatterData = useMemo(() => {
        return withDuration.map(p => ({
          x: p.durataGiorni, y: p.netto, id: p.idPratica, company: p.company, typology: p.typology, ore: p.ore
        }));
      }, [withDuration]);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: 20}}>
          <div className="kpi-grid">
            <Kpi label="Pratiche chiuse non-outlier" value={fmtNum(withDuration.length)} sub={`/ ${fmtNum(pratiche.length)} totali`} variant="alt" />
            <Kpi label="Durata media" value={fmtDays(overallMean)} variant="warn" />
            <Kpi label="Durata mediana" value={fmtDays(overallMedian)} variant="neutral" />
            <Kpi label="90° percentile" value={fmtDays(p90)} variant="violet" />
            <Kpi label="Outlier (avvio 01/01/2000)" value={fmtNum(outliers)} variant={outliers > 0 ? 'danger' : 'neutral'} sub="esclusi da analisi" />
            <Kpi label="Pratiche aperte" value={fmtNum(aperte)} variant="warn" sub="senza data chiusura" />
          </div>

          <div className="card">
            <div className="card-head">
              <div>
                <h3 className="card-title">Distribuzione tempi di lavorazione</h3>
                <div className="card-sub">Giorni da DATA AVVIO a DATA CHIUSURA · outlier esclusi · click sulle barre</div>
              </div>
              <span className="drill-hint">clic-attivo</span>
            </div>
            <div className="hist">
              {hist.bins.map((b, i) => (
                <div key={i}
                     className="hist-bar"
                     style={{
                       height: (b.count / hist.maxCount * 100) + '%',
                       background: i === 0 ? 'linear-gradient(180deg, #10b981, #059669)' : i < 3 ? 'linear-gradient(180deg, #3b82f6, #1e40af)' : i < 8 ? 'linear-gradient(180deg, #f59e0b, #c27803)' : 'linear-gradient(180deg, #ef4444, #c5291f)'
                     }}
                     title={`${b.label} gg · ${b.count} pratiche`}
                     onClick={() => b.pratiche.length && onDrill({
                       title: `Pratiche con durata ${b.label} giorni`,
                       subtitle: `${b.count} pratiche nella fascia ${b.label} gg`,
                       pratiche: b.pratiche
                     })} />
              ))}
            </div>
            <div className="hist-axis">
              {hist.bins.map((b,i) => <span key={i}>{b.from}</span>)}
            </div>
          </div>

          <div className="grid-2">
            <div className="card">
              <div className="card-head">
                <div>
                  <h3 className="card-title">Tempo medio per Typology</h3>
                  <div className="card-sub">Ordinato per durata decrescente</div>
                </div>
              </div>
              <ResponsiveContainer width="100%" height={Math.max(220, byTypology.length * 32)}>
                <BarChart data={byTypology} layout="vertical" margin={{top: 5, right: 70, left: 10, bottom: 0}}
                  onClick={(e) => { if (e && e.activeLabel) onDrill({
                    title: `Typology: ${e.activeLabel} · tempi`,
                    subtitle: `Pratiche chiuse non-outlier`,
                    pratiche: withDuration.filter(p => p.typology === e.activeLabel)
                  }); }}>
                  <CartesianGrid horizontal={false} stroke="#eef2f6" />
                  <XAxis type="number" tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={v => v + 'gg'} axisLine={false} tickLine={false} />
                  <YAxis type="category" dataKey="key" tick={{fontSize: 11, fill: '#1e293b'}} axisLine={false} tickLine={false} width={110} />
                  <Tooltip content={<TT valueFmt={v => fmtDec(v, 0) + ' gg'} clickable />} />
                  <Bar dataKey="durataMedia" radius={[0,4,4,0]} name="Durata media">
                    {byTypology.map((e,i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
                    <LabelList dataKey="durataMedia" position="right" formatter={v => fmtDec(v, 0) + 'gg'} style={{fontSize: 10, fill: '#334155', fontWeight: 600}} />

    // --- Documenti (FTT vs NC) ---
    const DocumentiView = ({ pratiche, docs, onDrill }) => {
      const fttCount = docs.filter(d => d.tipoDoc === 'FTT').length;
      const ncCount = docs.filter(d => d.tipoDoc === 'NC').length;
      const fttTot = docs.filter(d => d.tipoDoc === 'FTT').reduce((s,d) => s + d.invoiced, 0);
      const ncTot = docs.filter(d => d.tipoDoc === 'NC').reduce((s,d) => s + d.invoiced, 0);
      const conNc = pratiche.filter(p => p.hasNc);

      // Netto per mese (waterfall)
      const monthly = useMemo(() => {
        const m = new Map();
        for (const d of docs) {
          if (!d.__mk) continue;
          const e = m.get(d.__mk) || { key: d.__mk, label: monthLabel(d.__mk), ftt: 0, nc: 0, net: 0 };
          if (d.tipoDoc === 'NC') e.nc += d.invoiced; else e.ftt += d.invoiced;
          e.net += d.invoiced;
          m.set(d.__mk, e);
        }
        return Array.from(m.values()).sort((a,b) => a.key.localeCompare(b.key));
      }, [docs]);

      // Pratiche con impatto NC rilevante
      const impattoNc = useMemo(() => {
        return [...conNc].sort((a,b) => Math.abs(b.totNc) - Math.abs(a.totNc));
      }, [conNc]);

      return (
        <div style={{display: 'flex', flexDirection: 'column', gap: 20}}>

            <Kpi label="Documenti totali" value={fmtNum(docs.length)} />

            <div className="card-head">
              <div>
                <h3 className="card-title">Distribuzione documenti per periodo</h3>
                <div className="card-sub">FTT (positive) vs NC (negative) · linea = netto mensile · click per drill</div>
              </div>
              <span className="drill-hint">clic-attivo</span>
            </div>

              <ComposedChart data={monthly} margin={{top: 5, right: 20, left: 0, bottom: 0}}
                onClick={(e) => { if (e && e.activeLabel) {
                  const mk = monthly.find(m => m.label === e.activeLabel)?.key;
                  if (mk) onDrill({
                    title: `Documenti di ${monthLabelLong(mk)}`,
                    subtitle: `Pratiche con documenti emessi nel mese`,
                    pratiche: pratiche.filter(p => p.docs.some(d => d.__mk === mk))
                  });
                }}}>
                <CartesianGrid vertical={false} stroke="#eef2f6" />
                <XAxis dataKey="label" tick={{fontSize: 10, fill: '#64748b'}} axisLine={false} tickLine={false} interval="preserveStartEnd" />
                <YAxis tick={{fontSize: 10, fill: '#64748b'}} tickFormatter={fmtEurShort} axisLine={false} tickLine={false} />
                <Tooltip content={<TT clickable />} />
                <Legend wrapperStyle={{fontSize: 11, paddingTop: 6}} iconType="circle" />
                <Bar dataKey="ftt" name="FTT" fill="#3b82f6" radius={[3,3,0,0]} stackId="a" />
                <Bar dataKey="nc" name="NC" fill="#ef4444" radius={[0,0,3,3]} stackId="a" />
                <Line type="monotone" dataKey="net" name="Netto" stroke="#1e40af" strokeWidth={1.5} dot={{r:2}} />
                <ReferenceLine y={0} stroke="#94a3b8" strokeDasharray="2 2" />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          <div className="card">
            <div className="card-head">
              <div>
                <h3 className="card-title">Pratiche con rettifiche (NC)</h3>

              </div>

            ) : (
              <div className="tbl-wrap" style={{maxHeight: 500}}>

      const [onlyNc, setOnlyNc] = useState(false);
      const [onlyOpen, setOnlyOpen] = useState(false);
      const perPage = 30;

      const filtered = useMemo(() => {
        let arr = pratiche;
        if (onlyNc) arr = arr.filter(p => p.hasNc);
        if (onlyOpen) arr = arr.filter(p => !p.isChiusa);
        if (search) {
          const q = search.toLowerCase();
          arr = arr.filter(p => [p.idPratica, p.company, p.gruppo, p.typology, p.lines].filter(Boolean).some(v => String(v).toLowerCase().includes(q)));
        }
        return arr;
      }, [pratiche, search, onlyNc, onlyOpen]);

      const sorted = useMemo(() => {
        const arr = [...filtered];
        arr.sort((a,b) => {
          let va = a[sortBy], vb = b[sortBy];
          if (va instanceof Date) va = va.getTime();
          if (vb instanceof Date) vb = vb.getTime();
          if (va == null && vb == null) return 0;
          if (va == null) return sortDir === 'asc' ? -1 : 1;
          if (vb == null) return sortDir === 'asc' ? 1 : -1;
          if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va - vb : vb - va;
          va = String(va); vb = String(vb);
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        return arr;
      }, [filtered, sortBy, sortDir]);

      useEffect(() => { setPage(1); }, [filtered, sortBy, sortDir]);
      const totalPages = Math.max(1, Math.ceil(sorted.length / perPage));
      const pageData = sorted.slice((page-1) * perPage, page * perPage);

      const setSort = (k) => {
        if (sortBy === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortBy(k); setSortDir('desc'); }
      };

      const exportCsv = () => {
        const headers = ['ID PRATICA','COMPANY','GRUPPO','LINES','TYPOLOGY','FAMILY','SALES','CONSULTANT','FY','SERVICE MODE','N DOCS','N FTT','N NC','TOT FTT','TOT NC','NETTO','ORE','EUR/H','DATA AVVIO','DATA CHIUSURA','DURATA GG','OUTLIER','CONTRIBUTO','ULTIMA FTT DATA','ULTIMA FTT IMPORTO'];
        const rows = sorted.map(p => [
          p.idPratica, p.company, p.gruppo, p.lines, p.typology, p.family, p.sales, p.consultant, p.fy, p.serviceMode,
          p.nDocs, p.nFtt, p.nNc, p.totFtt, p.totNc, p.netto, p.ore, p.eurPerOra != null ? p.eurPerOra : '',
          isoDate(p.dataAvvio), isoDate(p.dataChiusura), p.durataGiorni != null ? p.durataGiorni : '',
          p.avvioIsOutlier ? 'SI' : 'NO', p.contributo,
          p.lastFttDate ? isoDate(p.lastFttDate) : '', p.lastFtt ? p.lastFtt.invoiced : ''
        ]);
        const esc = (v) => {
          if (v == null) return '';
          const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
          return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
        };
        const lines = [headers.join(';')];
        for (const r of rows) lines.push(r.map(esc).join(';'));
        const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `pratiche_aggregate_${new Date().toISOString().slice(0,10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const SI = ({ col }) => sortBy !== col ? null : <span style={{marginLeft: 3, color: '#3b82f6'}}>{sortDir === 'asc' ? '↑' : '↓'}</span>;

      return (
        <div className="card">
          <div className="card-head">
            <div>
              <h3 className="card-title">Pratiche aggregate</h3>
              <div className="card-sub">{fmtNum(sorted.length)} pratiche · click su una riga per dettaglio documenti</div>
            </div>
            <div className="card-actions">
              <input type="text" placeholder="Cerca cliente, pratica, typology..." value={search} onChange={e => setSearch(e.target.value)}

              <button className={`chip ${onlyNc ? 'active' : ''}`} onClick={() => setOnlyNc(!onlyNc)}>Con NC</button>

              <button className="btn btn-outline btn-sm" onClick={exportCsv}>
                <Icon name="download" size={12} /> Esporta CSV
              </button>
            </div>
          </div>
          <div className="tbl-wrap" style={{maxHeight: 640}}>
            <table className="tbl">
              <thead>
                <tr>
                  <th className="sortable" onClick={() => setSort('idPratica')}>ID Pratica<SI col="idPratica" /></th>
                  <th className="sortable" onClick={() => setSort('company')}>Cliente<SI col="company" /></th>
                  <th className="sortable" onClick={() => setSort('typology')}>Typology<SI col="typology" /></th>
                  <th className="sortable" onClick={() => setSort('sales')}>Sales<SI col="sales" /></th>
                  <th className="sortable" onClick={() => setSort('consultant')}>Tech<SI col="consultant" /></th>
                  <th className="sortable" onClick={() => setSort('fy')}>FY<SI col="fy" /></th>
                  <th className="num sortable" onClick={() => setSort('nDocs')}>Doc<SI col="nDocs" /></th>
                  <th className="num sortable" onClick={() => setSort('netto')}>Netto<SI col="netto" /></th>
                  <th className="num sortable" onClick={() => setSort('ore')}>Ore<SI col="ore" /></th>
                  <th className="num sortable" onClick={() => setSort('eurPerOra')}>€/h<SI col="eurPerOra" /></th>
                  <th className="sortable" onClick={() => setSort('dataAvvio')}>Avvio<SI col="dataAvvio" /></th>
                  <th className="sortable" onClick={() => setSort('dataChiusura')}>Chiusura<SI col="dataChiusura" /></th>
                  <th className="num sortable" onClick={() => setSort('durataGiorni')}>Durata<SI col="durataGiorni" /></th>
                </tr>
              </thead>
              <tbody>
                {pageData.length === 0 && <tr><td colSpan="13" className="empty">Nessuna pratica con i filtri attivi</td></tr>}
                {pageData.map((p, i) => (
                  <tr key={i} className="clickable" onClick={() => onDrill({
                    title: `Pratica: ${p.idPratica}`,
                    subtitle: `${p.company} · ${p.typology || ''} · dettaglio`,
                    pratiche: [p]
                  })}>
                    <td className="mono truncate" title={p.idPratica} style={{maxWidth: 240, fontSize: 11}}>{p.idPratica}</td>
                    <td className="truncate" title={p.company} style={{maxWidth: 180}}>{p.company}</td>
                    <td>{p.typology || '—'}</td>
                    <td>{p.sales || '—'}</td>
                    <td className="muted">{p.consultant || '—'}</td>
                    <td><span className="badge">{p.fy}</span></td>
                    <td className="num">
                      {p.nDocs}
                      {p.hasNc && <span className="badge nc" style={{marginLeft: 4}}>NC</span>}
                    </td>
                    <td className="num"><strong className={p.netto < 0 ? 'neg' : ''}>{fmtEur(p.netto)}</strong></td>
                    <td className="num">{p.ore > 0 ? fmtDec(p.ore, 1) : '—'}</td>
                    <td className="num muted">{p.eurPerOra != null ? fmtEur(p.eurPerOra) : '—'}</td>
                    <td className="muted">
                      {p.dataAvvio ? formatDate(p.dataAvvio) : '—'}
                      {p.avvioIsOutlier && <span className="badge outlier" style={{marginLeft: 4}}>out</span>}
                    </td>
                    <td className="muted">{p.dataChiusura ? formatDate(p.dataChiusura) : <span className="badge open">aperta</span>}</td>
                    <td className="num">{p.durataGiorni != null ? fmtDays(p.durataGiorni) : '—'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="pagination">
            <div>{fmtNum((page-1)*perPage + 1)}–{fmtNum(Math.min(page*perPage, sorted.length))} di {fmtNum(sorted.length)}</div>
            <div className="pager">
              <button className="btn btn-outline btn-sm" onClick={() => setPage(1)} disabled={page === 1}>«</button>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(p => Math.max(1, p-1))} disabled={page === 1}>‹</button>
              <span style={{padding: '5px 10px', fontSize: 11, fontVariantNumeric: 'tabular-nums'}}>{page} / {totalPages}</span>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page === totalPages}>›</button>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(totalPages)} disabled={page === totalPages}>»</button>
            </div>
          </div>
        </div>
      );
    };

    // --- Dettaglio documenti (riga per riga raw) ---
    const DocumentiRawView = ({ docs }) => {
