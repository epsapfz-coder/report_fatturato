          if (vb instanceof Date) vb = vb.getTime();
          if (typeof va === 'number' && typeof vb === 'number') return sortDir === 'asc' ? va - vb : vb - va;
          va = va == null ? '' : String(va); vb = vb == null ? '' : String(vb);
          return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        });
        return arr;
      }, [docs, sortBy, sortDir]);

        ]);
        const esc = (v) => {

          return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
        };
        const lines = [headers.join(';')];
        for (const r of rows) lines.push(r.map(esc).join(';'));

        const url = URL.createObjectURL(blob);

        a.href = url; a.download = `documenti_${new Date().toISOString().slice(0,10)}.csv`;

        URL.revokeObjectURL(url);
      };

      const SI = ({ col }) => sortBy !== col ? null : <span style={{marginLeft: 3, color: '#3b82f6'}}>{sortDir === 'asc' ? '↑' : '↓'}</span>;

      return (
        <div className="card">
          <div className="card-head">
            <div>
              <h3 className="card-title">Documenti · vista raw</h3>
              <div className="card-sub">{fmtNum(docs.length)} righe · una riga per documento (FTT o NC)</div>
            </div>
            <div className="card-actions">
              <button className="btn btn-outline btn-sm" onClick={exportCsv}>
                <Icon name="download" size={12} /> Esporta CSV
              </button>
            </div>
          </div>
          <div className="tbl-wrap" style={{maxHeight: 640}}>
            <table className="tbl">
              <thead>
                <tr>
                  <th className="sortable" onClick={() => setSort('month')}>Mese<SI col="month" /></th>
                  <th className="sortable" onClick={() => setSort('tipoDoc')}>Tipo<SI col="tipoDoc" /></th>
                  <th className="sortable" onClick={() => setSort('fy')}>FY<SI col="fy" /></th>
                  <th className="sortable" onClick={() => setSort('company')}>Cliente<SI col="company" /></th>
                  <th className="sortable" onClick={() => setSort('idPratica')}>ID Pratica<SI col="idPratica" /></th>
                  <th className="sortable" onClick={() => setSort('lines')}>Lines<SI col="lines" /></th>
                  <th className="sortable" onClick={() => setSort('typology')}>Typology<SI col="typology" /></th>
                  <th className="sortable" onClick={() => setSort('sales')}>Sales<SI col="sales" /></th>
                  <th className="sortable" onClick={() => setSort('consultant')}>Tech<SI col="consultant" /></th>
                  <th className="num sortable" onClick={() => setSort('invoiced')}>Importo<SI col="invoiced" /></th>
                </tr>
              </thead>
              <tbody>
                {pageData.length === 0 && <tr><td colSpan="10" className="empty">Nessun documento</td></tr>}
                {pageData.map((d, i) => (
                  <tr key={i} className={d.tipoDoc === 'NC' ? 'neg' : ''}>
                    <td className="muted">{d.month ? formatDate(d.month) : '—'}</td>
                    <td><span className={`badge ${d.tipoDoc === 'NC' ? 'nc' : 'ftt'}`}>{d.tipoDoc}</span></td>
                    <td><span className="badge">{d.fy}</span></td>
                    <td className="truncate" title={d.company} style={{maxWidth: 180}}>{d.company}</td>
                    <td className="mono truncate" title={d.idPratica} style={{maxWidth: 220, fontSize: 11}}>{d.idPratica}</td>
                    <td className="truncate" title={d.lines} style={{maxWidth: 160}}>{d.lines || '—'}</td>
                    <td>{d.typology || '—'}</td>
                    <td>{d.sales || '—'}</td>
                    <td className="muted">{d.consultant || '—'}</td>
                    <td className="num"><strong>{fmtEur(d.invoiced)}</strong></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="pagination">
            <div>{fmtNum((page-1)*perPage + 1)}–{fmtNum(Math.min(page*perPage, sorted.length))} di {fmtNum(sorted.length)}</div>
            <div className="pager">
              <button className="btn btn-outline btn-sm" onClick={() => setPage(1)} disabled={page === 1}>«</button>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(p => Math.max(1, p-1))} disabled={page === 1}>‹</button>
              <span style={{padding: '5px 10px', fontSize: 11, fontVariantNumeric: 'tabular-nums'}}>{page} / {totalPages}</span>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(p => Math.min(totalPages, p+1))} disabled={page === totalPages}>›</button>
              <button className="btn btn-outline btn-sm" onClick={() => setPage(totalPages)} disabled={page === totalPages}>»</button>
            </div>
          </div>
        </div>
      );
    };

    // ============== App ==============

    const DEFAULT_FILTERS = {
      fy: [], sales: [], consultant: [], typology: [], family: [], serviceMode: [], newBack: [], tipoDoc: [],
      monthFrom: '', monthTo: '', search: '', onlyWithOre: false, excludeOutliers: false
    };

    function App() {
      const [rawDocs, setRawDocs] = useState([]);
      const [fileInfo, setFileInfo] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [filters, setFilters] = useState(DEFAULT_FILTERS);
      const [tab, setTab] = useState('overview');
      const [modal, setModal] = useState(null);
      const fileRef = useRef(null);

      const handleFile = useCallback(async (file) => {
        setLoading(true); setError(null);
        try {
          const result = await loadExcel(file);
          if (result.rows.length === 0) throw new Error('Nessun record trovato nel foglio. Verifica la struttura.');
          setRawDocs(result.rows);
          setFileInfo({ name: file.name, sheet: result.sheet, count: result.rows.length, keyMap: result.keyMap });
          setFilters(DEFAULT_FILTERS);
          setTab('overview');
        } catch (e) {
          setError(e.message || 'Errore durante il caricamento del file');
        } finally {
          setLoading(false);
        }
      }, []);

      // Filter options (from raw docs)
      const opt = useMemo(() => {
        if (!rawDocs.length) return {};
        const uniq = (k) => Array.from(new Set(rawDocs.map(r => r[k]).filter(v => v != null && v !== ''))).sort((a,b) => String(a).localeCompare(String(b)));
        return {
          fy: uniq('fy'),
          sales: uniq('sales'),
          consultant: uniq('consultant'),
          typology: uniq('typology'),
          family: uniq('family'),
          serviceMode: uniq('serviceMode'),
          newBack: uniq('newBack'),
          tipoDoc: uniq('tipoDoc'),
        };
      }, [rawDocs]);

      // Apply filters on raw docs
      const filteredDocs = useMemo(() => {
        if (!rawDocs.length) return [];
        const mFrom = fromMonthInput(filters.monthFrom);
        const mTo = fromMonthInput(filters.monthTo);
        const mToEnd = mTo ? new Date(mTo.getFullYear(), mTo.getMonth() + 1, 0, 23, 59, 59) : null;
        const q = filters.search.trim().toLowerCase();
        return rawDocs.filter(r => {
          if (filters.fy.length && !filters.fy.includes(r.fy)) return false;
          if (filters.sales.length && !filters.sales.includes(r.sales)) return false;
          if (filters.consultant.length && !filters.consultant.includes(r.consultant)) return false;
          if (filters.typology.length && !filters.typology.includes(r.typology)) return false;
          if (filters.family.length && !filters.family.includes(r.family)) return false;
          if (filters.serviceMode.length && !filters.serviceMode.includes(r.serviceMode)) return false;
          if (filters.newBack.length && !filters.newBack.includes(r.newBack)) return false;
          if (filters.tipoDoc.length && !filters.tipoDoc.includes(r.tipoDoc)) return false;
          if (mFrom && r.month && r.month < mFrom) return false;
          if (mToEnd && r.month && r.month > mToEnd) return false;
          if (filters.onlyWithOre && (!r.ore || r.ore <= 0)) return false;
          if (filters.excludeOutliers && isOutlier(r.dataAvvio)) return false;
          if (q) {
            const hay = [r.company, r.gruppo, r.lines, r.linesPreciso, r.idPratica].filter(Boolean).join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [rawDocs, filters]);

      // Aggregate to practice-level
      const pratiche = useMemo(() => aggregatePratiche(filteredDocs), [filteredDocs]);

      // KPIs
      const kpis = useMemo(() => {
        const totNetto = pratiche.reduce((s,p) => s + p.netto, 0);
        const totFtt = filteredDocs.filter(d => d.tipoDoc === 'FTT').reduce((s,d) => s + d.invoiced, 0);
        const totNc = filteredDocs.filter(d => d.tipoDoc === 'NC').reduce((s,d) => s + d.invoiced, 0);
        const totOre = pratiche.reduce((s,p) => s + (p.ore || 0), 0);
        const eurOra = totOre > 0 ? totNetto / totOre : 0;
        const conNc = pratiche.filter(p => p.hasNc).length;
        const chiuse = pratiche.filter(p => p.isChiusa).length;
        const durate = pratiche.filter(p => p.durataGiorni != null).map(p => p.durataGiorni);
        const durMedia = durate.length ? durate.reduce((a,b) => a+b, 0) / durate.length : null;
        return { totNetto, totFtt, totNc, totOre, eurOra, conNc, chiuse, durMedia, nPratiche: pratiche.length, nDocs: filteredDocs.length };
      }, [pratiche, filteredDocs]);

      const activeFilterCount = [
        filters.fy.length, filters.sales.length, filters.consultant.length, filters.typology.length,
        filters.family.length, filters.serviceMode.length, filters.newBack.length, filters.tipoDoc.length,
        filters.monthFrom ? 1 : 0, filters.monthTo ? 1 : 0, filters.search ? 1 : 0,
        filters.onlyWithOre ? 1 : 0, filters.excludeOutliers ? 1 : 0
      ].reduce((a,b) => a+b, 0);

      const resetFilters = () => setFilters(DEFAULT_FILTERS);

      if (rawDocs.length === 0) {
        return (
          <div className="app">
            <div className="header">
              <div className="brand">
                <div className="brand-mark">E</div>
                <div className="brand-text">
                  <h1>Report Fatturato & Pratiche</h1>
                  <p>EPSA Italy · Finanza agevolata</p>
                </div>
              </div>
            </div>
            <Upload onFile={handleFile} error={error} loading={loading} />
          </div>
        );
      }

      const tabs = [
        { id: 'overview', label: 'Overview', icon: 'chart' },
        { id: 'pratiche', label: 'Pratiche', icon: 'briefcase' },
        { id: 'tempi', label: 'Tempi lavorazione', icon: 'hourglass' },
        { id: 'ore', label: 'Ore & €/h', icon: 'clock' },
        { id: 'documenti', label: 'FTT & NC', icon: 'receipt' },
        { id: 'sales', label: 'Sales', icon: 'trend' },
        { id: 'consultants', label: 'Consulenti', icon: 'users' },
        { id: 'typology', label: 'Typology', icon: 'package' },
        { id: 'clients', label: 'Clienti', icon: 'award' },
        { id: 'rawdocs', label: 'Docs raw', icon: 'table' },
      ];

      return (
        <div className="app">
          <div className="header">
            <div className="brand">
              <div className="brand-mark">E</div>
              <div className="brand-text">
                <h1>Report Fatturato & Pratiche</h1>
                <p>EPSA Italy · Finanza agevolata</p>
              </div>
            </div>
            <div className="header-actions">
              <div className="file-status">
                <span className="dot"></span>
                <span><strong>{fileInfo?.name}</strong> · {fileInfo?.sheet} · {fmtNum(fileInfo?.count)} doc</span>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => fileRef.current?.click()}>
                <Icon name="upload" size={12} /> Cambia file
              </button>
              <input ref={fileRef} type="file" accept=".xlsx,.xlsm,.xls" onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
            </div>
          </div>

          {/* Filters */}
          <div className="filters">
            <div className="filters-row">
              <div className="filter-group">
                <span className="filter-label">FY</span>
                <ChipSelect options={opt.fy || []} value={filters.fy} onChange={v => setFilters(f => ({...f, fy: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Sales</span>
                <ChipSelect options={opt.sales || []} value={filters.sales} onChange={v => setFilters(f => ({...f, sales: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Consultant</span>
                <ChipSelect options={opt.consultant || []} value={filters.consultant} onChange={v => setFilters(f => ({...f, consultant: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Tipo Doc</span>
                <ChipSelect options={opt.tipoDoc || []} value={filters.tipoDoc} onChange={v => setFilters(f => ({...f, tipoDoc: v}))} />
              </div>
            </div>
            <div className="filters-row" style={{marginTop: 12}}>
              <div className="filter-group">
                <span className="filter-label">Typology</span>
                <ChipSelect options={opt.typology || []} value={filters.typology} onChange={v => setFilters(f => ({...f, typology: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Family</span>
                <ChipSelect options={opt.family || []} value={filters.family} onChange={v => setFilters(f => ({...f, family: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Service Mode</span>
                <ChipSelect options={opt.serviceMode || []} value={filters.serviceMode} onChange={v => setFilters(f => ({...f, serviceMode: v}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">New / Back</span>
                <ChipSelect options={opt.newBack || []} value={filters.newBack} onChange={v => setFilters(f => ({...f, newBack: v}))} />
              </div>
            </div>
            <div className="filters-row" style={{marginTop: 12, alignItems: 'center'}}>
              <div className="filter-group filter-compact">
                <span className="filter-label">Da mese</span>
                <input type="month" value={filters.monthFrom} onChange={e => setFilters(f => ({...f, monthFrom: e.target.value}))} />
              </div>
              <div className="filter-group filter-compact">
                <span className="filter-label">A mese</span>
                <input type="month" value={filters.monthTo} onChange={e => setFilters(f => ({...f, monthTo: e.target.value}))} />
              </div>
              <div className="filter-group filter-compact">
                <span className="filter-label">Ricerca</span>
                <input type="text" placeholder="Cliente, gruppo, line, id pratica..." value={filters.search} onChange={e => setFilters(f => ({...f, search: e.target.value}))} />
              </div>
              <div className="filter-group">
                <span className="filter-label">Opzioni</span>
                <div style={{display: 'flex', gap: 4}}>
                  <button className={`chip ${filters.onlyWithOre ? 'active' : ''}`} onClick={() => setFilters(f => ({...f, onlyWithOre: !f.onlyWithOre}))}>Solo con ore</button>
                  <button className={`chip ${filters.excludeOutliers ? 'active' : ''}`} onClick={() => setFilters(f => ({...f, excludeOutliers: !f.excludeOutliers}))}>Escludi outlier</button>
                </div>
              </div>
              <div className="filter-actions">
                {activeFilterCount > 0 && <span className="filter-summary">{activeFilterCount} filtri attivi</span>}
                <button className="btn btn-outline btn-sm" onClick={resetFilters} disabled={activeFilterCount === 0}>
                  <Icon name="x" size={12} /> Reset
                </button>
              </div>
            </div>
          </div>

          {/* Tabs */}
          <div className="tabs">
            {tabs.map(t => (
              <button key={t.id} className={`tab-btn ${tab === t.id ? 'active' : ''}`} onClick={() => setTab(t.id)}>
                {t.label}
                {t.id === 'pratiche' && <span className="count">{fmtNum(kpis.nPratiche)}</span>}
                {t.id === 'rawdocs' && <span className="count">{fmtNum(kpis.nDocs)}</span>}
              </button>
            ))}
          </div>

          <div className="main">
            {/* KPIs */}
            <div className="kpi-grid">
              <Kpi label="Netto (FTT-NC)" value={fmtEur(kpis.totNetto)} sub={`${fmtNum(kpis.nPratiche)} pratiche · ${fmtNum(kpis.nDocs)} doc`} />
              <Kpi label="Totale FTT" value={fmtEurShort(kpis.totFtt)} variant="alt" subVariant="pos" sub="fatture emesse" />
              <Kpi label="Totale NC" value={fmtEurShort(kpis.totNc)} variant="danger" subVariant="neg" sub={`${fmtNum(kpis.conNc)} pratiche con NC`} />
              <Kpi label="Ore lavorate" value={fmtDec(kpis.totOre, 0) + ' h'} variant="violet" sub={kpis.totOre > 0 ? `${fmtEur(kpis.eurOra)}/h medio` : null} />
              <Kpi label="Durata media" value={fmtDays(kpis.durMedia)} variant="warn" sub={`${fmtNum(kpis.chiuse)}/${fmtNum(kpis.nPratiche)} chiuse`} />
              <Kpi label="Contributi ottenuti" value={fmtEurShort(pratiche.reduce((s,p) => s + (p.contributo||0), 0))} variant="neutral" />
            </div>

            {/* Tab content */}
            {pratiche.length === 0 ? (
              <div className="card empty">
                Nessun dato con i filtri attivi.
                <button className="btn btn-outline btn-sm" style={{marginLeft: 10}} onClick={resetFilters}>Reset filtri</button>
              </div>
            ) : (
              <>
                {tab === 'overview' && <OverviewView pratiche={pratiche} docs={filteredDocs} onDrill={setModal} />}
                {tab === 'pratiche' && <PraticheView pratiche={pratiche} onDrill={setModal} />}
                {tab === 'tempi' && <TempiView pratiche={pratiche} onDrill={setModal} />}
                {tab === 'ore' && <OreView pratiche={pratiche} onDrill={setModal} />}
                {tab === 'documenti' && <DocumentiView pratiche={pratiche} docs={filteredDocs} onDrill={setModal} />}
                {tab === 'sales' && <RankingView pratiche={pratiche} dim="sales" label="Sales" onDrill={setModal} />}
                {tab === 'consultants' && <RankingView pratiche={pratiche} dim="consultant" label="Consulente" onDrill={setModal} />}
                {tab === 'typology' && <RankingView pratiche={pratiche} dim="typology" label="Typology" onDrill={setModal} />}
                {tab === 'clients' && <ClientiView pratiche={pratiche} onDrill={setModal} />}
                {tab === 'rawdocs' && <DocumentiRawView docs={filteredDocs} />}
              </>
            )}
          </div>

          {modal && (
            <PraticheModal
              title={modal.title}
              subtitle={modal.subtitle}
              pratiche={modal.pratiche}
              onClose={() => setModal(null)}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
